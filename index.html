<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Capture Log" />
    <link rel="apple-touch-icon" href="./icon-192.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./styles.css" />
    <title>Capture Log</title>
  </head>
  <body>
    <main class="app-shell">
      <video id="preview" class="preview" playsinline muted aria-label="카메라 미리보기"></video>
      <div class="vignette" aria-hidden="true"></div>

      <header class="top-bar">
        <div>
          <p class="eyebrow">SENSOR CAPTURE</p>
          <p id="capture-status" class="status">준비 중</p>
        </div>
        <button id="flip-camera" class="icon-button" type="button" aria-label="전면 또는 후면 카메라 전환">↻</button>
      </header>

      <section class="readout" aria-live="polite">
        <p class="readout-label">COMPASS HEADING</p>
        <p id="heading" class="heading">—°</p>
        <p id="heading-meta" class="heading-meta">센서 권한을 허용하면 표시됩니다</p>
      </section>

      <section class="telemetry" aria-label="실시간 센서 상태">
        <div><span>GPS</span><strong id="gps-readout">대기</strong></div>
        <div><span>ORIENT.</span><strong id="orientation-readout">대기</strong></div>
        <div><span>MOTION</span><strong id="motion-readout">대기</strong></div>
      </section>

      <section id="camera-options" class="camera-options" hidden>
        <span class="ratio-label">카메라 렌즈</span>
        <div class="ratio-options" role="group" aria-label="카메라 렌즈 선택">
          <button class="ratio-button lens-button" type="button" data-camera-lens="wide">1× 기본</button>
          <button class="ratio-button lens-button" type="button" data-camera-lens="ultrawide">0.5× 초광각</button>
        </div>
        <small id="lens-status">권한 허용 후 Safari가 초광각 카메라를 확인합니다.</small>
      </section>

      <section id="permission-panel" class="permission-panel">
        <h1>영상과 센서를 함께 기록</h1>
        <p>카메라, 위치, 동작 및 방향 권한을 허용하세요. 데이터는 이 기기에만 저장됩니다.</p>
        <div id="ratio-panel" class="ratio-panel" hidden>
          <span class="ratio-label">촬영 비율</span>
          <div class="ratio-options" role="group" aria-label="촬영 비율 선택">
            <button class="ratio-button" type="button" data-capture-ratio="4:3">4:3</button>
            <button class="ratio-button" type="button" data-capture-ratio="16:9">16:9</button>
            <button class="ratio-button" type="button" data-capture-ratio="1:1">1:1</button>
          </div>
          <small>Apple 기기에서 카메라에 비율을 요청합니다. 실제 적용 비율은 기기에서 확인됩니다.</small>
        </div>
        <button id="enable-button" class="primary-button" type="button">카메라 및 센서 활성화</button>
        <p id="compatibility" class="compatibility"></p>
      </section>

      <section class="controls" aria-label="녹화 제어">
        <button id="export-button" class="secondary-button" type="button" disabled>데이터 다운로드</button>
        <button id="record-button" class="record-button" type="button" disabled aria-label="녹화 시작">
          <span id="record-indicator"></span>
        </button>
        <output id="timer" class="timer">00:00</output>
      </section>

      <section id="notice" class="notice" hidden></section>
    </main>
    <script type="module" src="./app.js?v=13"></script>
  </body>
</html>
